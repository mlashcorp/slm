gpu:
  type: "RTX 4090"
  count: 1
  min_vram_gb: 24

instance:
  image: "pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel"
  disk_gb: 140

project:
  local_path: "/home/ubuntu/code/slm"
  remote_path: "/workspace/slm"
  exclude:
  - "__pycache__"
  - "*.pyc"
  - ".git"
  - "*.egg-info"
  - ".venv"
  - "data"
  - "checkpoints"

r2:
  bucket: "ml-datasets"
  mount_path: "/workspace/datasets"
  sync_subdir: "phase5/baseline"

run_id: "phase5_baseline_124m"

training:
  command: "bash phase5/baseline/remote_nanochat_baseline.sh"
  tmux_session: "train"

wandb:
  project: "slm-phase5-baseline"

hf:
  repo: "mlashcorp/slm-phase5-checkpoints"
