gpu:
  type: "RTX 5090"
  count: 1
  min_vram_gb: 24

instance:
  image: "pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel"
  disk_gb: 120

project:
  local_path: "/home/ubuntu/code/slm"
  remote_path: "/workspace/slm"
  exclude:
    - "__pycache__"
    - "*.pyc"
    - ".git"
    - "*.egg-info"
    - ".venv"
    - "data"
    - "checkpoints"

r2:
  bucket: "ml-datasets"
  mount_path: "/workspace/datasets"
  sync_subdir: "phase5/e2e/nanochat"

training:
  command: "bash phase5/e2e/remote_nanochat_smoke.sh"
  tmux_session: "train"

wandb:
  project: "slm-phase5-e2e"
